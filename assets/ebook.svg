<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <linearGradient id="cover" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C4D0B5"/>
      <stop offset="50%" stop-color="#8FA37E"/>
      <stop offset="100%" stop-color="#6B7F5C"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8924A"/>
      <stop offset="100%" stop-color="#8A6A2E"/>
    </linearGradient>
  </defs>
  <!-- Book shape with shadow -->
  <rect x="40" y="20" width="520" height="760" rx="8" fill="#333" opacity=".1" transform="translate(8,8)"/>
  <rect x="40" y="20" width="520" height="760" rx="8" fill="url(#cover)"/>
  <!-- Spine -->
  <rect x="40" y="20" width="30" height="760" rx="8" fill="#5C7148" opacity=".5"/>
  <!-- Double border frame -->
  <rect x="65" y="45" width="470" height="710" rx="4" fill="none" stroke="#B8924A" stroke-width="1.5" opacity=".45"/>
  <rect x="72" y="52" width="456" height="696" rx="3" fill="none" stroke="#B8924A" stroke-width=".8" opacity=".25"/>
  <!-- Corner ornaments -->
  <circle cx="80" cy="60" r="4" fill="#B8924A" opacity=".4"/>
  <circle cx="528" cy="60" r="4" fill="#B8924A" opacity=".4"/>
  <circle cx="80" cy="740" r="4" fill="#B8924A" opacity=".4"/>
  <circle cx="528" cy="740" r="4" fill="#B8924A" opacity=".4"/>
  <!-- Eyebrow -->
  <line x1="220" y1="120" x2="380" y2="120" stroke="#B8924A" stroke-width="1" opacity=".5"/>
  <text x="300" y="105" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#FAF6EE" letter-spacing="3" opacity=".7">LIVRO DE RECEITAS · 1ª EDIÇÃO</text>
  <!-- Dog + Bowl illustration area -->
  <circle cx="300" cy="340" r="130" fill="#FAF6EE" opacity=".1"/>
  <!-- Simplified dog -->
  <ellipse cx="300" cy="310" rx="60" ry="70" fill="#E8B69C" opacity=".5"/>
  <ellipse cx="300" cy="260" rx="40" ry="45" fill="#E8B69C" opacity=".5"/>
  <circle cx="285" cy="250" r="5" fill="#2F3A2C" opacity=".5"/>
  <circle cx="315" cy="250" r="5" fill="#2F3A2C" opacity=".5"/>
  <ellipse cx="300" cy="270" rx="8" ry="5" fill="#2F3A2C" opacity=".35"/>
  <!-- Ears -->
  <ellipse cx="265" cy="225" rx="15" ry="25" fill="#C97B5E" opacity=".4" transform="rotate(-15 265 225)"/>
  <ellipse cx="335" cy="225" rx="15" ry="25" fill="#C97B5E" opacity=".4" transform="rotate(15 335 225)"/>
  <!-- Bowl in front -->
  <ellipse cx="300" cy="400" rx="70" ry="25" fill="#C97B5E" opacity=".6"/>
  <ellipse cx="300" cy="390" rx="60" ry="20" fill="#FAF6EE" opacity=".7"/>
  <!-- Food dots -->
  <circle cx="280" cy="385" r="8" fill="#6B7F5C" opacity=".5"/>
  <circle cx="300" cy="382" r="7" fill="#C97B5E" opacity=".4"/>
  <circle cx="320" cy="387" r="9" fill="#B8924A" opacity=".4"/>
  <!-- Hearts -->
  <text x="240" y="350" font-size="16" opacity=".3" fill="#C97B5E">♡</text>
  <text x="350" y="340" font-size="12" opacity=".25" fill="#C97B5E">♡</text>
  <!-- Steam -->
  <path d="M285 370 Q288 350 285 330" stroke="#FAF6EE" stroke-width="2" fill="none" opacity=".25"/>
  <path d="M315 365 Q318 345 315 325" stroke="#FAF6EE" stroke-width="2" fill="none" opacity=".2"/>
  <!-- Title -->
  <text x="300" y="510" text-anchor="middle" font-family="serif" font-size="56" fill="#FAF6EE" font-weight="300" opacity=".95">Saúde</text>
  <text x="300" y="575" text-anchor="middle" font-family="serif" font-size="56" fill="#FAF6EE" font-style="italic" font-weight="300" opacity=".95">na Tigela</text>
  <!-- Subtitle -->
  <text x="300" y="630" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#FAF6EE" opacity=".6">Um guia de alimentação natural</text>
  <text x="300" y="652" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#FAF6EE" opacity=".6">para transformar a vida do seu pet</text>
  <!-- Author -->
  <line x1="200" y1="690" x2="400" y2="690" stroke="#B8924A" stroke-width=".8" opacity=".4"/>
  <text x="300" y="720" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#FAF6EE" opacity=".6">Dra. Jhennifer Espírito Santo</text>
  <text x="300" y="738" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#FAF6EE" opacity=".4">Medicina Veterinária Integrativa</text>
  <!-- Footer ornament -->
  <text x="300" y="770" text-anchor="middle" font-size="12" fill="#B8924A" opacity=".4">✦  ✦  ✦</text>
</svg>
